name: Showroom amount beta16.3.7

on:
  push:
    branches: [main]
    paths: ['.github/workflows/showroom_amount_beta_16_3_7.yml']

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused patch
        run: python .github/scripts/showroom_amount_beta_16_3_7.py
      - name: Install dependencies
        run: npm install
      - name: TypeScript + Vite build
        run: npm run build
      - name: Commit update and clean one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/showroom_amount_beta_16_3_7.yml .github/scripts/showroom_amount_beta_16_3_7.py
          git add src/pages/AgendaV2.tsx package.json package-lock.json
          git commit -m "fix: let manager choose showroom amount at close"
          git push origin HEAD:main
