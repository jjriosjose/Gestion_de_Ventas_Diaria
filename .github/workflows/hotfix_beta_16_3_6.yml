          rep(p,"  if(purchased&&Number(amount)<=0)return alert('Indica el monto de venta de la compra realizada en showroom.')\n","  if(purchased&&allowAmount&&amount&&Number(amount)<=0)return alert('El monto debe ser mayor que cero o quedar vacío como pendiente.')\n")
