          rep(p,"const [loadError,setLoadError]=useState(''),[validate,setValidate]=useState<any|null>(null),[finish,setFinish]=useState<any|null>(null),[busy,setBusy]=useState(false)","const [loadError,setLoadError]=useState(''),[validate,setValidate]=useState<any|null>(null),[finish,setFinish]=useState<any|null>(null),[amountEdit,setAmountEdit]=useState<any|null>(null),[busy,setBusy]=useState(false)")
          rep(p,"supabase.from('showroom_sessions').select('*,clients(client_type)')","supabase.from('showroom_sessions').select('*,clients(id,codempr,legal_name,client_type),prospects(prospect_code,legal_name)')")
          rep(p," const showroomSalesToday=todayClosedShowroom.filter(s=>s.purchased===true).reduce((sum,s)=>sum+Number(s.purchase_amount||0),0)\n", " const showroomSalesToday=todayClosedShowroom.filter(s=>s.purchased===true).reduce((sum,s)=>sum+Number(s.purchase_amount||0),0)\n const purchasedWithAmountToday=todayClosedShowroom.filter(s=>s.purchased===true&&s.purchase_amount!=null).length\n const purchasedPendingToday=purchased-purchasedWithAmountToday\n const pendingShowroomAmounts=useMemo(()=>admin?sessions.filter(s=>s.purchased===true&&s.ended_at&&s.purchase_amount==null):[],[admin,sessions])\n")
