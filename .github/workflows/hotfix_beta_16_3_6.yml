          new="{purchased&&<label className=\"span-2\">Monto de venta RD${allowAmount?<><input autoFocus type=\"number\" min=\"0.01\" step=\"0.01\" value={amount} onChange={e=>setAmount(e.target.value)} placeholder=\"Opcional · puede completarse después\"/><small>Administración puede registrarlo ahora o dejarlo pendiente para cuando la orden esté digitada.</small></>:<><input disabled value=\"\" placeholder=\"Pendiente de registro administrativo\"/><small>La compra puede cerrarse sin monto. Solo Administración podrá completarlo posteriormente.</small></>}</label>}"
