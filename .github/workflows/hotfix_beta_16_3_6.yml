          new=" const vendorRows=useMemo(()=>{const ids=new Set([...commercialByEmployee.keys(),...journeyByEmployee.keys()]);return[...ids].map(id=>{const base=commercialByEmployee.get(id)||employees.find(e=>e.id===id);if(!base||base.employee_type!=='Vendedor')return null;const j=journeyByEmployee.get(id)||{},cov=coverageBreakdown(j.rows||[]);const captures=Number(j.captures||0);const totalVisits=Number(j.totalVisits||0);return{employee_id:id,full_name:base.full_name,job_title:base.job_title,active_days:base.days?.size||0,journeys:j.journeys||0,planned_clients:j.planned||0,visited_clients:j.visited||0,additional_visits:j.additional||0,total_visits:totalVisits,captures,activities:Number(j.activities||totalVisits+captures),coverage_pct:cov.operationalPct,coverage_plan_pct:cov.planPct,coverage_free_pct:cov.freePct,resolution_pct:pct(j.resolved||0,j.planned||0),street_seconds:j.streetSeconds||0,attention_seconds:j.attention||0,avg_visit_seconds:totalVisits?Number(j.attention||0)/totalVisits:0,transit_seconds:j.transit||0,distance:j.distance||0,purchase_clients:base.purchase||0,sales_amount:base.sales||0}}).filter(Boolean).sort((a:any,b:any)=>b.activities-a.activities||b.sales_amount-a.sales_amount) as any[]},[commercialByEmployee,journeyByEmployee,employees])"
          rep(p,old,new)
