          append='''

function EditShowroomAmount({session,onClose,onSaved}:{session:any;onClose:()=>void;onSaved:()=>Promise<void>|void}){
 const [amount,setAmount]=useState(session.purchase_amount==null?'':String(session.purchase_amount)),[busy,setBusy]=useState(false)
 const save=async()=>{if(amount&&Number(amount)<=0)return alert('El monto debe ser mayor que cero o quedar vacío.');setBusy(true);try{const {error}=await supabase.from('showroom_sessions').update({purchase_amount:amount?Number(amount):null}).eq('id',session.id).eq('purchased',true);if(error)throw error;await onSaved()}catch(e){alert(e instanceof Error?e.message:'No se pudo registrar el monto')}finally{setBusy(false)}}
 return <div className="modal-wrap" role="dialog" aria-modal="true" aria-label="Registrar monto showroom"><button className="modal-backdrop" onClick={onClose}/><div className="modal"><div className="modal-head"><div><span className="eyebrow">ADMINISTRACIÓN · SHOWROOM</span><h3>Registrar monto de compra</h3><p>La compra ya fue confirmada comercialmente. Completa el monto cuando la orden esté disponible.</p></div><button className="icon-btn" onClick={onClose}><X/></button></div><div className="form-grid"><label className="span-2">Monto de venta RD$<input autoFocus type="number" min="0.01" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00"/><small>Si se deja vacío, continuará marcado como monto pendiente.</small></label></div><div className="modal-actions"><button className="secondary" disabled={busy} onClick={onClose}>Cancelar</button><button className="primary" disabled={busy} onClick={()=>void save()}>{busy?'Guardando...':'Guardar monto'}</button></div></div></div>
}
'''
          Path(p).write_text(Path(p).read_text()+append)

