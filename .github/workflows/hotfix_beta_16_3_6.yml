name: Hotfix beta16.3.6

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hotfix_beta_16_3_6.yml']

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.event.head_commit.message == 'chore: launch beta16.3.6 hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply beta16.3.6 source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              actual=s.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:100]!r}')
              s=s.replace(old,new,count)
              p.write_text(s)

          def sub(path, pattern, new, count=1):
              p=Path(path); s=p.read_text()
              s2,n=re.subn(pattern,new,s,count=count,flags=re.S)
              if n != count:
                  raise SystemExit(f'{path}: regex expected {count}, got {n}: {pattern[:100]!r}')
              p.write_text(s2)

          # Dashboard workspace: operational coverage = Plan + Libre target (5 per free journey).
          p='src/pages/DashboardWorkspace.tsx'
          rep(p,"route_plan_id,employee_id,route_date,derived_status,planned_clients,visited_clients,resolved_clients,coverage_pct","route_plan_id,route_session_id,employee_id,route_date,derived_status,route_mode,planned_clients,visited_clients,total_completed_visits,resolved_clients,coverage_pct",2)
          sub(p,r"  const stats=useMemo\(\(\)=>\{.*?\n  \},\[rows\]\)",'''  const stats=useMemo(()=>{
    const todayRows=rows.filter(r=>r.route_date===today())
    const planRows=todayRows.filter(r=>r.route_mode!=='LIBRE')
    const freeRows=todayRows.filter(r=>r.route_mode==='LIBRE'&&r.route_session_id)
    const planObjective=planRows.reduce((s,r)=>s+Number(r.planned_clients||0),0)
    const planDone=planRows.reduce((s,r)=>s+Number(r.visited_clients||0),0)
    const freeObjective=freeRows.length*5
    const freeDone=freeRows.reduce((s,r)=>s+Math.min(Number(r.total_completed_visits||0),5),0)
    return {planned:todayRows.filter(r=>r.derived_status==='PLANIFICADA').length,active:todayRows.filter(r=>r.derived_status==='ACTIVA').length,finalized:todayRows.filter(r=>['FINALIZADA','FINALIZADA_PARCIAL'].includes(r.derived_status)).length,expired:rows.filter(r=>r.derived_status==='PENDIENTE_CIERRE').length,planCoverage:pct(planDone,planObjective),freeCoverage:pct(freeDone,freeObjective),coverage:pct(planDone+freeDone,planObjective+freeObjective)}
  },[rows])''')
          rep(p,"<span><b>{stats.coverage}%</b> cobertura hoy</span>","<span><b>{stats.coverage}%</b> cobertura operativa</span>")

          # Dashboard: same coverage semantics everywhere + total purchases for managers.
          p='src/pages/DashboardV2.tsx'
          rep(p,"const zero={active_employees:0,planned_clients:0,visited_clients:0,received_clients:0,visit_purchase_clients:0,showroom_purchase_clients:0,call_purchase_clients:0,purchase_clients:0,visit_sales_amount:0,showroom_sales_amount:0,call_sales_amount:0,sales_amount:0,calls:0,calls_contacted:0,inbound_calls:0,outbound_calls:0,appointments:0,showroom_attended:0,prospects_captured:0,routes_started:0,routes_completed:0,route_execution_pct:0,call_contact_rate_pct:0,estimated_distance_m:0,gps_segments:0}","const zero={active_employees:0,planned_clients:0,visited_clients:0,received_clients:0,visit_purchase_clients:0,showroom_purchase_clients:0,call_purchase_clients:0,purchase_clients:0,visit_sales_amount:0,showroom_sales_amount:0,call_sales_amount:0,sales_amount:0,calls:0,calls_contacted:0,inbound_calls:0,outbound_calls:0,appointments:0,showroom_attended:0,prospects_captured:0,routes_started:0,routes_completed:0,route_execution_pct:0,call_contact_rate_pct:0,estimated_distance_m:0,gps_segments:0,plan_objective:0,free_objective:0,plan_coverage_pct:0,free_coverage_pct:0,operational_coverage_pct:0}")
          rep(p,"const coveragePct=(row:any)=>ratioPct(Number(row.visited_clients||0),Number(row.planned_clients||0))","const coveragePct=(row:any)=>Number(row.operational_coverage_pct??ratioPct(Number(row.visited_clients||0),Number(row.planned_clients||0)))")
          rep(p,"const activityCount=(row:any)=>Number(row.visited_clients||0)+Number(row.prospects_captured||0)\n","const activityCount=(row:any)=>Number(row.visited_clients||0)+Number(row.prospects_captured||0)\nconst coverageSummary=(rows:any[])=>{const planRows=rows.filter(r=>r.route_mode!=='LIBRE'),freeRows=rows.filter(r=>r.route_mode==='LIBRE'&&r.route_session_id);const planObjective=planRows.reduce((s,r)=>s+Number(r.planned_clients||0),0),planDone=planRows.reduce((s,r)=>s+Number(r.visited_clients||0),0),freeObjective=freeRows.length*5,freeDone=freeRows.reduce((s,r)=>s+Math.min(Number(r.total_completed_visits||0),5),0);return{plan_objective:planObjective,free_objective:freeObjective,plan_coverage_pct:ratioPct(planDone,planObjective),free_coverage_pct:ratioPct(freeDone,freeObjective),operational_coverage_pct:ratioPct(planDone+freeDone,planObjective+freeObjective)}}\n")
          rep(p,"const [{data:g},{data:e},{data:rm},{count:clients},{count:geo},{count:verified}]=await Promise.all([","const [{data:g},{data:e},{data:rm},{data:j},{count:clients},{count:geo},{count:verified}]=await Promise.all([")
          rep(p,"  supabase.from('executive_daily_route_metrics').select('*').eq('day',day),\n  supabase.from('clients')","  supabase.from('executive_daily_route_metrics').select('*').eq('day',day),\n  supabase.from('executive_route_journeys_v4').select('employee_id,route_session_id,route_mode,planned_clients,visited_clients,total_completed_visits').eq('route_date',day),\n  supabase.from('clients')")
          old="]);const metricMap=new Map((rm||[]).map((m:any)=>[m.employee_id,m]));const employeeRows=(e||[]).map((row:any)=>{const metric:any=metricMap.get(row.employee_id)||{};return {...row,purchase_clients:Number(row.purchase_clients_all??row.purchase_clients??0),sales_amount:Number(row.sales_amount_all??row.sales_amount??0),estimated_distance_m:Number(metric.estimated_distance_m||0),gps_segments:Number(metric.gps_segments||0)}});const distanceTotal=employeeRows.reduce((s:number,r:any)=>s+Number(r.estimated_distance_m||0),0),gpsSegments=employeeRows.reduce((s:number,r:any)=>s+Number(r.gps_segments||0),0);setGlobal({...zero,...(g||{}),estimated_distance_m:distanceTotal,gps_segments:gpsSegments});setEmployees(employeeRows);setStats"
          new="]);const metricMap=new Map((rm||[]).map((m:any)=>[m.employee_id,m]));const coverageMap=new Map<string,any[]>();(j||[]).forEach((r:any)=>coverageMap.set(r.employee_id,[...(coverageMap.get(r.employee_id)||[]),r]));const globalCoverage=coverageSummary(j||[]);const employeeRows=(e||[]).map((row:any)=>{const metric:any=metricMap.get(row.employee_id)||{},coverage=coverageSummary(coverageMap.get(row.employee_id)||[]);return {...row,...coverage,purchase_clients:Number(row.purchase_clients_all??row.purchase_clients??0),sales_amount:Number(row.sales_amount_all??row.sales_amount??0),estimated_distance_m:Number(metric.estimated_distance_m||0),gps_segments:Number(metric.gps_segments||0)}});const distanceTotal=employeeRows.reduce((s:number,r:any)=>s+Number(r.estimated_distance_m||0),0),gpsSegments=employeeRows.reduce((s:number,r:any)=>s+Number(r.gps_segments||0),0);setGlobal({...zero,...(g||{}),...globalCoverage,estimated_distance_m:distanceTotal,gps_segments:gpsSegments});setEmployees(employeeRows);setStats"
          rep(p,old,new)
          rep(p,"<KpiCard label=\"Planificados\" value={global.planned_clients||0} sub={`${global.route_execution_pct||0}% cobertura real`} Icon={Route}/>","<KpiCard label=\"Planificados\" value={global.planned_clients||0} sub=\"clientes en rutas planificadas\" Icon={Route}/><KpiCard label=\"Cobertura operativa\" value={`${global.operational_coverage_pct||0}%`} sub={`P ${global.plan_objective?`${global.plan_coverage_pct}%`:'N/A'} · L ${global.free_objective?`${global.free_coverage_pct}%`:'N/A'}`} Icon={MapPinCheck}/>")
          rep(p,"<span><b>{row.call_purchase_clients||0}</b> compras llamada</span><span><b>{row.showroom_attended||0}</b> showroom</span>","<span><b>{row.purchase_clients||0}</b> compras</span><span><b>{row.showroom_attended||0}</b> showroom</span>")

          # Jornadas: Plan, Libre and Operational coverage side by side.
          p='src/pages/Journeys.tsx'
          rep(p,"const statusLabel:Record<string,string>={NO_INICIADA:'No ejecutada',PLANIFICADA:'Planificada',PROGRAMADA:'Programada',FINALIZADA_PARCIAL:'Finalizada parcial',FINALIZADA:'Finalizada',PENDIENTE_CIERRE:'Pendiente de cierre',ACTIVA:'Activa hoy'}\n","const statusLabel:Record<string,string>={NO_INICIADA:'No ejecutada',PLANIFICADA:'Planificada',PROGRAMADA:'Programada',FINALIZADA_PARCIAL:'Finalizada parcial',FINALIZADA:'Finalizada',PENDIENTE_CIERRE:'Pendiente de cierre',ACTIVA:'Activa hoy'}\nconst coverageBreakdown=(rows:any[])=>{const planRows=rows.filter(r=>r.route_mode!=='LIBRE'),freeRows=rows.filter(r=>r.route_mode==='LIBRE'&&r.route_session_id);const planObjective=planRows.reduce((s,r)=>s+Number(r.planned_clients||0),0),planDone=planRows.reduce((s,r)=>s+Number(r.visited_clients||0),0),freeObjective=freeRows.length*5,freeDone=freeRows.reduce((s,r)=>s+Math.min(Number(r.total_completed_visits||0),5),0);return{planObjective,planDone,freeObjective,freeDone,plan:pct(planDone,planObjective),free:pct(freeDone,freeObjective),operational:pct(planDone+freeDone,planObjective+freeObjective)}}\nconst journeyCoverage=(row:any)=>coverageBreakdown([row]).operational\n")
          sub(p,r" const stats=useMemo\(\(\)=>\{.*?\},\[filtered\]\)",''' const stats=useMemo(()=>{const planned=filtered.reduce((s,r)=>s+Number(r.planned_clients||0),0),visited=filtered.reduce((s,r)=>s+Number(r.visited_clients||0),0),additional=filtered.reduce((s,r)=>s+Number(r.additional_visits||0),0),totalVisits=filtered.reduce((s,r)=>s+Number(r.total_completed_visits||0),0),captures=filtered.reduce((s,r)=>s+Number(r.capture_count||0),0),activities=filtered.reduce((s,r)=>s+Number(r.commercial_activity_count??(Number(r.total_completed_visits||0)+Number(r.capture_count||0))),0),resolved=filtered.reduce((s,r)=>s+Number(r.resolved_clients||0),0),attention=filtered.reduce((s,r)=>s+Number(r.visit_seconds||0),0),transit=filtered.reduce((s,r)=>s+Number(r.transit_wait_estimated_seconds||0),0),cov=coverageBreakdown(filtered);return{journeys:filtered.length,started:filtered.filter(r=>!!r.route_session_id).length,active:filtered.filter(r=>r.derived_status==='ACTIVA').length,expired:filtered.filter(r=>r.derived_status==='PENDIENTE_CIERRE').length,finalized:filtered.filter(r=>['FINALIZADA','FINALIZADA_PARCIAL'].includes(r.derived_status)).length,notStarted:filtered.filter(r=>r.derived_status==='NO_INICIADA').length,planned,visited,additional,totalVisits,captures,activities,resolved,coverage:cov.plan,freeCoverage:cov.free,operationalCoverage:cov.operational,planObjective:cov.planObjective,planDone:cov.planDone,freeObjective:cov.freeObjective,freeDone:cov.freeDone,resolution:pct(resolved,planned),seconds:filtered.reduce((s,r)=>s+Number(r.route_window_seconds||0),0),attention,avgVisit:totalVisits?attention/totalVisits:0,transit,distance:filtered.reduce((s,r)=>s+Number(r.estimated_distance_m||0),0),incidents:filtered.reduce((s,r)=>s+Number(r.incident_count||0),0),free:filtered.filter(r=>r.route_mode==='LIBRE').length}},[filtered])''')
          rep(p,"'Cobertura %':r.route_mode==='LIBRE'?'N/A':Number(r.coverage_pct||0)","'Cobertura plan %':r.route_mode==='LIBRE'?'N/A':Number(r.coverage_pct||0),'Cobertura libre %':r.route_mode==='LIBRE'?journeyCoverage(r):'N/A','Cobertura operativa %':journeyCoverage(r)")
          rep(p,"La cobertura siempre usa solo el plan original; visitas y captaciones se reportan por separado.","La cobertura separa rutas planificadas y jornadas libres; la cobertura operativa combina ambas sin contar captaciones como visitas.")
          rep(p,"<MetricCard icon={<Gauge/>} label=\"Cobertura plan\" value={`${stats.coverage}%`} note={`${stats.visited}/${stats.planned} planificados visitados`} tone=\"brand\"/>","<MetricCard icon={<Gauge/>} label=\"Cobertura plan\" value={stats.planObjective?`${stats.coverage}%`:'N/A'} note={stats.planObjective?`${stats.planDone}/${stats.planObjective} planificados visitados`:'Sin rutas planificadas'} tone=\"brand\"/><MetricCard icon={<Gauge/>} label=\"Cobertura libre\" value={stats.freeObjective?`${stats.freeCoverage}%`:'N/A'} note={stats.freeObjective?`${stats.freeDone}/${stats.freeObjective} objetivo mínimo`:'Sin jornadas libres'} tone=\"success\"/><MetricCard icon={<Target/>} label=\"Cobertura operativa\" value={`${stats.operationalCoverage}%`} note={`Plan ${stats.planObjective?`${stats.coverage}%`:'N/A'} · Libre ${stats.freeObjective?`${stats.freeCoverage}%`:'N/A'}`} tone=\"brand\"/>")
          rep(p,"<th>Cobertura</th>","<th>Cobertura op.</th>")
          rep(p,"{row.route_mode==='LIBRE'?'N/A':`${Number(row.coverage_pct||0)}%`}","{`${journeyCoverage(row)}%`}")
          rep(p,"<Mini label=\"Cobertura plan\" value={selected.route_mode==='LIBRE'?'N/A':`${selected.coverage_pct}%`}/>","<Mini label={selected.route_mode==='LIBRE'?'Cobertura libre':'Cobertura plan'} value={`${journeyCoverage(selected)}%`}/>")

          # Reports: operational coverage follows the same rule; exports expose all three.
          p='src/pages/ReportsV2.tsx'
          rep(p,"const statusLabel:Record<string,string>={NO_INICIADA:'No ejecutada',PLANIFICADA:'Planificada',PROGRAMADA:'Programada',FINALIZADA_PARCIAL:'Finalizada parcial',FINALIZADA:'Finalizada',PENDIENTE_CIERRE:'Pendiente de cierre',ACTIVA:'Activa hoy'}\n","const statusLabel:Record<string,string>={NO_INICIADA:'No ejecutada',PLANIFICADA:'Planificada',PROGRAMADA:'Programada',FINALIZADA_PARCIAL:'Finalizada parcial',FINALIZADA:'Finalizada',PENDIENTE_CIERRE:'Pendiente de cierre',ACTIVA:'Activa hoy'}\nconst coverageBreakdown=(rows:any[])=>{const planRows=rows.filter(r=>r.route_mode!=='LIBRE'),freeRows=rows.filter(r=>r.route_mode==='LIBRE'&&r.route_session_id);const planObjective=planRows.reduce((s,r)=>s+Number(r.planned_clients||0),0),planDone=planRows.reduce((s,r)=>s+Number(r.visited_clients||0),0),freeObjective=freeRows.length*5,freeDone=freeRows.reduce((s,r)=>s+Math.min(Number(r.total_completed_visits||0),5),0);return{planObjective,freeObjective,planPct:pct(planDone,planObjective),freePct:pct(freeDone,freeObjective),operationalPct:pct(planDone+freeDone,planObjective+freeObjective)}}\n")
          sub(p,r" const street=useMemo\(\(\)=>\{.*?\n \},\[filteredJourneys\]\)",''' const street=useMemo(()=>{
  const planned=sum(filteredJourneys,'planned_clients'),visited=sum(filteredJourneys,'visited_clients'),resolved=sum(filteredJourneys,'resolved_clients'),attention=sum(filteredJourneys,'visit_seconds'),totalVisits=sum(filteredJourneys,'total_completed_visits'),additional=sum(filteredJourneys,'additional_visits'),captures=sum(filteredJourneys,'capture_count'),activities=sum(filteredJourneys,'commercial_activity_count'),cov=coverageBreakdown(filteredJourneys)
  return{journeys:filteredJourneys.length,finished:filteredJourneys.filter(j=>['FINALIZADA','FINALIZADA_PARCIAL'].includes(j.derived_status)).length,expired:filteredJourneys.filter(j=>j.derived_status==='PENDIENTE_CIERRE').length,planned,visited,resolved,additional,totalVisits,captures,activities,coverage:cov.operationalPct,planCoverage:cov.planPct,freeCoverage:cov.freePct,planObjective:cov.planObjective,freeObjective:cov.freeObjective,resolution:pct(resolved,planned),distance:sum(filteredJourneys,'estimated_distance_m'),streetSeconds:sum(filteredJourneys,'route_window_seconds'),attention,avgVisit:totalVisits?attention/totalVisits:0,transit:sum(filteredJourneys,'transit_wait_estimated_seconds'),incidents:sum(filteredJourneys,'incident_count')}
 },[filteredJourneys])''')
          old=" const journeyByEmployee=useMemo(()=>{const map=new Map<string,any>();filteredJourneys.forEach(j=>{const x=map.get(j.employee_id)||{planned:0,visited:0,resolved:0,distance:0,journeys:0,streetSeconds:0,attention:0,transit:0,additional:0,totalVisits:0,captures:0,activities:0};x.planned+=Number(j.planned_clients||0);x.visited+=Number(j.visited_clients||0);x.resolved+=Number(j.resolved_clients||0);x.distance+=Number(j.estimated_distance_m||0);x.journeys+=1;x.streetSeconds+=Number(j.route_window_seconds||0);x.attention+=Number(j.visit_seconds||0);x.transit+=Number(j.transit_wait_estimated_seconds||0);x.additional+=Number(j.additional_visits||0);x.totalVisits+=Number(j.total_completed_visits||0);x.captures+=Number(j.capture_count||0);x.activities+=Number(j.commercial_activity_count||0);map.set(j.employee_id,x)});return map},[filteredJourneys])"
          new=" const journeyByEmployee=useMemo(()=>{const map=new Map<string,any>();filteredJourneys.forEach(j=>{const x=map.get(j.employee_id)||{planned:0,visited:0,resolved:0,distance:0,journeys:0,streetSeconds:0,attention:0,transit:0,additional:0,totalVisits:0,captures:0,activities:0,rows:[]};x.planned+=Number(j.planned_clients||0);x.visited+=Number(j.visited_clients||0);x.resolved+=Number(j.resolved_clients||0);x.distance+=Number(j.estimated_distance_m||0);x.journeys+=1;x.streetSeconds+=Number(j.route_window_seconds||0);x.attention+=Number(j.visit_seconds||0);x.transit+=Number(j.transit_wait_estimated_seconds||0);x.additional+=Number(j.additional_visits||0);x.totalVisits+=Number(j.total_completed_visits||0);x.captures+=Number(j.capture_count||0);x.activities+=Number(j.commercial_activity_count||0);x.rows.push(j);map.set(j.employee_id,x)});return map},[filteredJourneys])"
