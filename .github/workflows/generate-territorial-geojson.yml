name: Generate territorial GeoJSON

on:
  push:
    branches:
      - feature/geographic-intelligence-v2
    paths:
      - '.github/workflows/generate-territorial-geojson.yml'
  pull_request:
    paths:
      - '.github/workflows/generate-territorial-geojson.yml'
      - 'supabase/**'
      - 'src/pages/DataQuality.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install geospatial dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::sf
            any::jsonlite
            any::dplyr
            any::lifecycle
            any::magrittr
            any::pins
          needs: check

      - name: Install Dominican territorial package
        shell: Rscript {0}
        run: |
          pkg <- paste0('sf', 'DR')
          options(repos = c(
            adatar = 'https://adatar-do.r-universe.dev',
            CRAN = 'https://cloud.r-project.org'
          ))
          install.packages(pkg, dependencies = FALSE)
          stopifnot(requireNamespace(pkg, quietly = TRUE))

      - name: Export territorial layers
        shell: Rscript {0}
        run: |
          library(sf)
          pkg <- paste0('sf', 'DR')
          dr_regions <- getExportedValue(pkg, 'dr_regions')
          dr_provinces <- getExportedValue(pkg, 'dr_provinces')
          dr_municipalities <- getExportedValue(pkg, 'dr_municipalities')
          dr_municipal_districts <- getExportedValue(pkg, 'dr_municipal_districts')

          dir.create('territorial-export', recursive = TRUE, showWarnings = FALSE)

          export_geojson <- function(x, path) {
            x <- st_make_valid(st_transform(x, 4326))
            if (any(st_is_empty(x))) stop(sprintf('Empty geometries detected in %s', path))
            st_write(
              x,
              path,
              driver = 'GeoJSON',
              delete_dsn = TRUE,
              quiet = TRUE,
              layer_options = c('COORDINATE_PRECISION=6')
            )
            invisible(nrow(x))
          }

          regions <- dr_regions(.sf = TRUE, .uniques = TRUE)
          provinces <- dr_provinces(.sf = TRUE, .reg = TRUE, .uniques = TRUE)
          municipalities <- dr_municipalities(.sf = TRUE, .prov = TRUE, .reg = TRUE, .uniques = TRUE)
          municipal_districts <- dr_municipal_districts(.sf = TRUE, .mun = TRUE, .prov = TRUE, .reg = TRUE, .uniques = TRUE)

          expected <- c(REGION = 10L, PROVINCIA = 32L, MUNICIPIO = 158L, DISTRITO_MUNICIPAL = 393L)
          actual <- c(
            REGION = nrow(regions),
            PROVINCIA = nrow(provinces),
            MUNICIPIO = nrow(municipalities),
            DISTRITO_MUNICIPAL = nrow(municipal_districts)
          )
          if (!identical(unname(actual), unname(expected))) {
            stop(sprintf(
              'Unexpected territorial feature counts. Expected %s; got %s',
              paste(expected, collapse = ','),
              paste(actual, collapse = ',')
            ))
          }

          all_bbox <- st_bbox(municipalities)
          if (all_bbox[['xmin']] < -73 || all_bbox[['xmax']] > -67 || all_bbox[['ymin']] < 17 || all_bbox[['ymax']] > 21) {
            stop(sprintf('Unexpected Dominican Republic bounding box: %s', paste(all_bbox, collapse = ',')))
          }

          export_geojson(regions, 'territorial-export/regions.geojson')
          export_geojson(provinces, 'territorial-export/provinces.geojson')
          export_geojson(municipalities, 'territorial-export/municipalities.geojson')
          export_geojson(municipal_districts, 'territorial-export/municipal-districts.geojson')

          manifest <- data.frame(
            layer = names(actual),
            expected_features = as.integer(expected),
            actual_features = as.integer(actual),
            source = rep('sfDR / IDERD / ONE Division Territorial 2021', 4),
            crs = rep(st_crs(municipalities)$input, 4),
            generated_at_utc = rep(format(Sys.time(), tz = 'UTC', usetz = TRUE), 4),
            stringsAsFactors = FALSE
          )
          write.csv(manifest, 'territorial-export/manifest.csv', row.names = FALSE)

      - name: Validate generated files
        run: |
          test -s territorial-export/regions.geojson
          test -s territorial-export/provinces.geojson
          test -s territorial-export/municipalities.geojson
          test -s territorial-export/municipal-districts.geojson
          ls -lh territorial-export
          wc -c territorial-export/*.geojson
          cat territorial-export/manifest.csv

      - name: Upload territorial artifact
        uses: actions/upload-artifact@v4
        with:
          name: dominican-territorial-geojson
          path: territorial-export/
          retention-days: 7
