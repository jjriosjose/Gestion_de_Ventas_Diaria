name: Generate territorial GeoJSON

on:
  push:
    branches:
      - feature/geographic-intelligence-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install geospatial dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::sf
            any::jsonlite
          needs: check

      - name: Install sfDR
        shell: Rscript {0}
        run: |
          install.packages(
            'sfDR',
            repos = c('https://adatar-do.r-universe.dev', 'https://cloud.r-project.org')
          )

      - name: Export territorial layers
        shell: Rscript {0}
        run: |
          library(sf)
          library(sfDR)

          dir.create('territorial-export', recursive = TRUE, showWarnings = FALSE)

          export_geojson <- function(x, path) {
            x <- st_make_valid(st_transform(x, 4326))
            st_write(
              x,
              path,
              driver = 'GeoJSON',
              delete_dsn = TRUE,
              quiet = TRUE,
              layer_options = c('COORDINATE_PRECISION=6')
            )
          }

          export_geojson(dr_regions(.sf = TRUE, .uniques = TRUE),
                         'territorial-export/regions.geojson')
          export_geojson(dr_provinces(.sf = TRUE, .reg = TRUE, .uniques = TRUE),
                         'territorial-export/provinces.geojson')
          export_geojson(dr_municipalities(.sf = TRUE, .prov = TRUE, .reg = TRUE, .uniques = TRUE),
                         'territorial-export/municipalities.geojson')
          export_geojson(dr_municipal_districts(.sf = TRUE, .mun = TRUE, .prov = TRUE, .reg = TRUE, .uniques = TRUE),
                         'territorial-export/municipal-districts.geojson')

          manifest <- data.frame(
            layer = c('REGION', 'PROVINCIA', 'MUNICIPIO', 'DISTRITO_MUNICIPAL'),
            expected_features = c(10L, 32L, 158L, 393L),
            source = rep('sfDR 0.2.2 / IDERD / ONE Division Territorial 2021', 4),
            stringsAsFactors = FALSE
          )
          write.csv(manifest, 'territorial-export/manifest.csv', row.names = FALSE)

      - name: Show generated files
        run: |
          ls -lh territorial-export
          wc -c territorial-export/*.geojson

      - name: Upload territorial artifact
        uses: actions/upload-artifact@v4
        with:
          name: dominican-territorial-geojson
          path: territorial-export/
          retention-days: 7
