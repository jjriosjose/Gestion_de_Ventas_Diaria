name: Apply beta16.3.8 production patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_beta_16_3_8.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused beta16.3.8 patch
        run: python .github/scripts/apply_beta_16_3_8.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript + Vite build
        run: npm run build
      - name: Commit production update and clean one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply_beta_16_3_8.yml .github/scripts/apply_beta_16_3_8.py
          git add src/pages/ReportsV2.tsx src/components/NotificationCenterBell.tsx src/styles/notification-center.css package.json package-lock.json
          git commit -m "fix: showroom close, realtime alerts and gestor full reports"
          git push origin HEAD:main
