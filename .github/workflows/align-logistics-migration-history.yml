name: Align logistics migration history

on:
  push:
    branches:
      - feature/logistics-delivery-v1
    paths:
      - .github/workflows/align-logistics-migration-history.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/logistics-delivery-v1
          fetch-depth: 0

      - name: Align migration filenames with Supabase history
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260906142500_logistics_delivery_v1_foundation.sql
          test -f supabase/migrations/20260906190000_delivery_access_pin_lockout.sql
          test -f supabase/migrations/20260906191500_delivery_proof_document_read_scope.sql
          test -f supabase/migrations/20260907123000_delivery_trip_operational_guards.sql
          test ! -e supabase/migrations/20260906182116_logistics_delivery_v1_foundation.sql
          test ! -e supabase/migrations/20260906191134_delivery_access_pin_lockout.sql
          test ! -e supabase/migrations/20260906191438_delivery_proof_document_read_scope.sql
          test ! -e supabase/migrations/20260907045800_delivery_trip_operational_guards.sql

          git mv supabase/migrations/20260906142500_logistics_delivery_v1_foundation.sql supabase/migrations/20260906182116_logistics_delivery_v1_foundation.sql
          git mv supabase/migrations/20260906190000_delivery_access_pin_lockout.sql supabase/migrations/20260906191134_delivery_access_pin_lockout.sql
          git mv supabase/migrations/20260906191500_delivery_proof_document_read_scope.sql supabase/migrations/20260906191438_delivery_proof_document_read_scope.sql
          git mv supabase/migrations/20260907123000_delivery_trip_operational_guards.sql supabase/migrations/20260907045800_delivery_trip_operational_guards.sql

      - name: Commit aligned history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "chore(supabase): align logistics migration versions"
          git push origin HEAD:feature/logistics-delivery-v1
