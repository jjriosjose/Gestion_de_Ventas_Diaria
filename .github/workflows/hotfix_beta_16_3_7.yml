name: Hotfix beta16.3.7 showroom amount choice

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hotfix_beta_16_3_7.yml']

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python .github/scripts/hotfix_beta_16_3_7.py
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit focused hotfix
        run: |
          rm .github/workflows/hotfix_beta_16_3_7.yml
          rm .github/scripts/hotfix_beta_16_3_7.py
          git config user.name 'jjriosjose'
          git config user.email '168056859+jjriosjose@users.noreply.github.com'
          git add src/pages/AgendaV2.tsx package.json package-lock.json .github/workflows/hotfix_beta_16_3_7.yml .github/scripts/hotfix_beta_16_3_7.py
          git commit -m 'fix: allow manager amount or pending at showroom close'
          git push
